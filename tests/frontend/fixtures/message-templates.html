<template id="tpl-message-shell-assistant">
<div class="message relative msg" data-ui="message">
  <div class="message-rail" data-ui="message-rail">
    
<div class="message-header">
  

<div class="message-avatar" data-slot="avatar"><img src="/@@avatar@@" alt="" class="cursor-pointer" onclick="openLightbox(this.src)" /></div>


  <div class="message-header-lines">
    
<div class="message-author" data-slot="author"></div>

<div class="message-meta" data-ui="message-meta"></div>

  </div>
</div>

    <div class="message-rail-end"></div>
  </div>
  <div class="message-body" data-ui="message-body"></div>
</div>
</template>
<template id="tpl-message-shell-user">
<div class="message relative msg" data-ui="message">
  <div class="message-rail" data-ui="message-rail">
    
<div class="message-header">
  

<div class="message-avatar" data-slot="avatar"><img src="/@@avatar@@" alt="" class="cursor-pointer" onclick="openLightbox(this.src)" /></div>


  <div class="message-header-lines">
    
<div class="message-author" data-slot="author"></div>

  </div>
</div>

    <div class="message-rail-end"></div>
  </div>
  <div class="message-body" data-ui="message-body"></div>
</div>
</template>
<template id="tpl-message-content">
<div class="message-content markdown-content processed pl-stream" data-ui="message-content markdown-content"></div>
</template>
<template id="tpl-message-spinner"><div class="message-spinner" data-ui="message-spinner"></div></template>
<template id="tpl-reasoning-toggle">
<button
  data-action="actionToggleReasoning"
  class="reasoning-toggle-btn inline-flex items-center gap-1 text-muted hover:text-[--text] transition-colors cursor-pointer hidden"
  data-ui="reasoning-toggle-btn"
  style="background:none;border:none;padding:0;font:inherit"
  aria-label="Toggle reasoning"
>
  <span class="reasoning-chevron caret-mark" aria-hidden="true"></span>
  <span>Reasoning</span>
</button>
</template>
<template id="tpl-reasoning-block">

<details class="details reasoning-block pl-stream" data-ui="reasoning-block" data-think-id="1">
  <summary>
    
<svg aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 chevron"><path d="m9 18 6-6-6-6"/></svg>

    <span>Reasoning</span>
  </summary>
  <div class="reasoning-content markdown-content" data-ui="reasoning-content markdown-content"></div>
</details>

</template>
<template id="tpl-reasoning-first">

<div class="reasoning-block pl-stream" data-ui="reasoning-block" data-think-id="0">
  <div class="reasoning-content markdown-content hidden" data-ui="reasoning-content markdown-content"></div>
</div>

</template>
<template id="tpl-tool-call">
<details class="details tool-call">
  <summary>
    
<svg aria-hidden="true" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3 chevron"><path d="m9 18 6-6-6-6"/></svg>

    <code>@@name@@</code>
    
    <span>@@args@@</span>
    
  </summary>
  <div class="tool-result-body" data-ui="tool-result-body">
    <pre></pre>
    
    
    <img src="@@image@@" alt="" />
    
  </div>
</details>
</template>
<template id="tpl-tool-calls-stream"><div class="tool-calls-stream pl-stream" data-ui="tool-calls-stream"></div></template>
<template id="tpl-tool-calls-section"><div class="tool-calls-section" data-ui="tool-calls-section"></div></template>
<template id="tpl-attachment-row">
<div class="attachment-row pl-stream"></div>
</template>
<template id="tpl-attachment-image">

<div class="message-attachment">
  <img src="@@src@@" alt="attachment" onclick="openLightbox(this.src)" />
</div>

</template>
<template id="tpl-attachment-audio">

<div class="message-attachment message-attachment-audio">
  
<svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>

  <audio controls>
    <source src="@@src@@" type="audio/mpeg" />
  </audio>
</div>

</template>
