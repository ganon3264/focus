<!-- Option Selection Modal (shared picker: OpenRouter route/quant, theme picker, ...) -->
{% from "macros.html" import icon_close %}
<div id="modal-select-option" class="modal-overlay sub hidden" role="dialog" aria-modal="true" aria-label="Select option"
     x-data="{ search: '', options: [], title: 'Select', select(value, label) { $dispatch('option-selected', { value: value, label: label }); } }"
     data-action="actionCloseModals">
  <div class="modal-content" style="max-width: 400px; width: 95vw; max-height: 60vh; overflow: hidden; background: var(--surface); padding: 0;">
    <div class="modal-header divider p-4">
      <div class="modal-title" x-text="title"></div>
      <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-select-option')" aria-label="Close">{{ icon_close(16) }}</button>
    </div>
    <div class="p-4" style="background: var(--surface-2); border-bottom: 1px solid var(--border);">
      <input type="text" x-model="search" placeholder="Search..." class="form-control" autocomplete="off" autofocus>
    </div>
    <div class="flex-1 overflow-y-auto p-2" style="max-height: 40vh; background: var(--surface);">
      <template x-for="opt in options.filter(o => o.label.toLowerCase().includes(search.toLowerCase()))" :key="opt.value">
        <div class="p-3 cursor-pointer rounded-md transition-colors hover:bg-[var(--surface-3)]"
             @click="select(opt.value, opt.label); closeModal('modal-select-option')">
          <span x-text="opt.label" class="text-sm"></span>
        </div>
      </template>
      <div x-show="options.length === 0" class="p-4 text-center text-muted text-sm">
        No options available.
      </div>
    </div>
  </div>
</div>
