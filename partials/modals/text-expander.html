{% from "modal-shell.html" import modal_shell %} {% call modal_shell('modal-text-expander', 'Edit
Text', max_width='896px',
content_style='height:85vh;', z_index='1000') %}
<textarea
  id="text-expander-input"
  class="field mono w-full flex-1"
  style="resize: none;"
></textarea>
<p class="note shrink-0 text-center">Changes apply to the field as you type.</p>
{% endcall %}

<script>
  if (!window.__textExpanderLoaded) {
    window.__textExpanderLoaded = true;
    let _expanderTarget = null;

    window.openTextExpander = function (targetEl, title) {
      _expanderTarget = targetEl;
      document.querySelector('#modal-text-expander [data-ui="modal-title"]').innerText = title || 'Edit Text';
      document.getElementById('text-expander-input').value = targetEl.value;
      window.openModal('modal-text-expander');
      document.getElementById('text-expander-input').focus();
    };

    document.getElementById('text-expander-input').addEventListener('input', function () {
      if (_expanderTarget) {
        _expanderTarget.value = this.value;
        _expanderTarget.dispatchEvent(new Event('input', { bubbles: true }));
      }
    });
  }
</script>
