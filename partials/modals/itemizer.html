{% from "macros.html" import icon_chevron_right, icon_refresh, hint_tooltip %}
<div x-data="itemizerModal()" @itemizer-open.window="load()" class="flex flex-col h-full min-h-0">
  <div class="itemizer-bar">
    <span class="note">Visualize and estimate tokens for the outbound prompt.</span>
    <span class="flex items-center gap-1">
      <span class="row-label">tokens</span>
      <span class="row-value itemizer-readout" x-text="totalTokens">…</span>
      {{ hint_tooltip('Estimate only. Computed with cl100k_base, so the real provider tokenizer may differ.') }}
      <button
        class="key sm"
        @click="load()"
        :disabled="loading"
        title="Refresh"
        aria-label="Refresh"
      >
        <span class="inline-flex" :class="loading ? 'animate-spin' : ''">{{ icon_refresh(14) }}</span>
      </button>
    </span>
  </div>

  <div class="itemizer-list flex-1 min-h-0">
    <div x-show="loading && messages.length === 0" class="empty">Generating estimate...</div>

    <template x-for="(msg, i) in messages" :key="i">
      <div x-data="{ expanded: false }" class="itemizer-item">
        <div class="row" :class="'role-' + msg.role" @click="expanded = !expanded">
          <span class="caret-mark" :class="expanded ? 'caret-open' : ''"></span>
          <span class="row-title" x-text="msg.role"></span>
          <span class="row-meta" x-text="msg.tokens + ' tk'"></span>
        </div>

        <div x-show="expanded" x-collapse>
          <div class="itemizer-body well">
            <template x-for="(part, j) in msg.parts" :key="j">
              <div
                x-show="part.type !== 'reasoning'"
                :class="part.type !== 'text' ? 'tag itemizer-part' : 'itemizer-text'"
                x-text="part.type !== 'text' ? part.text + ' (' + part.tokens + ' tk)' : part.text"
              ></div>
            </template>
            <template x-for="(part, j) in msg.parts" :key="'r'+j">
              <div x-show="part.type === 'reasoning'" x-data="{ rOpen: false }" class="itemizer-reasoning">
                <div class="link" @click="rOpen = !rOpen">
                  <span class="caret-mark" :class="rOpen ? 'caret-open' : ''"></span>
                  <span x-text="'reasoning (' + part.tokens + ' tk)'"></span>
                </div>
                <div x-show="rOpen" x-collapse class="note itemizer-text" x-text="part.text"></div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('itemizerModal', () => ({
      loading: false,
      messages: [],
      totalTokens: 0,

      async load() {
        const chatId = window.location.pathname.split('/').pop();
        if (!chatId || chatId === 'chat') return;

        this.loading = true;
        try {
          const payload = {
            chat_id: chatId,
            user_message: document.getElementById('chat-input')
              ? document.getElementById('chat-input').value
              : '',
            attachment_ids: [],
            regenerate: false, // default estimate
          };

          const res = await fetch('/api/itemize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            const data = await res.json();
            this.messages = data.messages;
            this.totalTokens = data.total_tokens;
          } else {
            console.error('Failed to itemize', await res.text());
          }
        } catch (e) {
          console.error(e);
        } finally {
          this.loading = false;
        }
      },
    }));
  });
</script>
