{% from "macros.html" import icon_chevron_right, icon_refresh, hint_tooltip %}
<div x-data="itemizerModal()" @itemizer-open.window="load()" class="flex flex-col h-full">
  <div class="itemizer-bar">
    <div class="itemizer-hint">Visualize and estimate tokens for the outbound prompt.</div>
    <div class="itemizer-bar-actions">
      <span class="itemizer-readout">
        tokens <span class="itemizer-readout-value" x-text="totalTokens">…</span>
      </span>
      {{ hint_tooltip('Estimate only. Computed with cl100k_base, so the real provider tokenizer may differ.') }}
      <button
        class="btn btn-secondary btn-sm btn-icon"
        @click="load()"
        :disabled="loading"
        title="Refresh"
        aria-label="Refresh"
      >
        <span class="inline-flex" :class="loading ? 'animate-spin' : ''">{{ icon_refresh(14) }}</span>
      </button>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto pb-2 flex flex-col scroll-fade">
    <template x-if="loading && messages.length === 0">
      <div class="text-center text-muted text-sm py-4">Generating estimate...</div>
    </template>

    <template x-for="(msg, i) in messages" :key="i">
      <div
        x-data="{ expanded: false }"
        class="itemizer-item"
        :class="'itemizer-role-' + msg.role"
      >
        <div class="itemizer-header" @click="expanded = !expanded">
          <div class="itemizer-header-left">
            <span class="itemizer-chevron" :class="expanded ? 'rotate-90' : ''"
              >{{ icon_chevron_right(12) }}</span
            >
            <span x-text="msg.role"></span>
          </div>
          <span class="itemizer-tokens" x-text="msg.tokens + ' tk'"></span>
        </div>

        <div x-show="expanded" x-collapse>
          <div class="itemizer-body">
            <template x-for="(part, j) in msg.parts" :key="j">
              <div
                x-show="part.type !== 'reasoning'"
                :class="part.type !== 'text' ? 'itemizer-part' : 'itemizer-text'"
                x-text="part.type !== 'text' ? part.text + ' (' + part.tokens + ' tk)' : part.text"
              ></div>
            </template>
            <template x-for="(part, j) in msg.parts" :key="'r'+j">
              <div x-show="part.type === 'reasoning'" x-data="{ rOpen: false }"
                class="itemizer-reasoning">
                <div class="itemizer-reasoning-header" @click="rOpen = !rOpen">
                  <span x-text="'reasoning (' + part.tokens + ' tk)'"></span>
                  <span x-text="rOpen ? '▲' : '▼'"></span>
                </div>
                <div x-show="rOpen" x-collapse class="itemizer-reasoning-text"
                  x-text="part.text"></div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('itemizerModal', () => ({
      loading: false,
      messages: [],
      totalTokens: 0,

      async load() {
        const chatId = window.location.pathname.split('/').pop();
        if (!chatId || chatId === 'chat') return;

        this.loading = true;
        try {
          const payload = {
            chat_id: chatId,
            user_message: document.getElementById('chat-input')
              ? document.getElementById('chat-input').value
              : '',
            attachment_ids: [],
            regenerate: false, // default estimate
          };

          const res = await fetch('/api/itemize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (res.ok) {
            const data = await res.json();
            this.messages = data.messages;
            this.totalTokens = data.total_tokens;
          } else {
            console.error('Failed to itemize', await res.text());
          }
        } catch (e) {
          console.error(e);
        } finally {
          this.loading = false;
        }
      },
    }));
  });
</script>
