{% from "macros.html" import icon_edit, icon_trash, icon_star, icon_star_filled, avatar %}
<div
  class="row entity-row{% if current_persona_id == p.id %} active{% endif %}"
  data-ui="entity-row"
  id="persona-card-{{ p.id }}"
  data-persona-name="{{ p.name }}"
  data-persona-created="{{ p.created_at }}"
  data-persona-group="{{ p.get('group_name') or '' }}"
  data-persona-favorite="{{ '1' if p.get('is_favorite') else '0' }}"
  role="button"
  tabindex="0"
  onclick="selectPersonaModal(this)"
  data-persona-id="{{ p.id }}"
>
  {{ avatar('avatar', p.avatar_path, p.name ~ ' avatar', p.name[:1], img_attrs='loading="lazy"') }}
  <span class="row-title" title="{{ p.description or '' }}">{{ p.name }}</span>
  <span class="row-meta">{{ p.get('group_name') or '—' }}</span>
  <span class="row-actions" onclick="event.stopPropagation()">
    <button
      class="key sm fav-star{% if p.get('is_favorite') %} favorite-active{% endif %}"
      data-ui="fav-star"
      onclick="event.stopPropagation(); togglePersonaFavorite(this)"
      aria-label="Toggle favorite"
      title="Favorite"
    >
      <span class="fav-star-outline">{{ icon_star(14) }}</span>
      <span class="fav-star-filled">{{ icon_star_filled(14) }}</span>
    </button>
    <button
      class="key sm"
      data-persona-id="{{ p.id }}"
      data-persona-name="{{ p.name }}"
      data-persona-desc="{{ p.description or '' }}"
      data-persona-image="{{ p.avatar_path or '' }}"
      data-persona-group="{{ p.get('group_name') or '' }}"
      data-persona-media="{{ p.images | tojson | forceescape }}"
      onclick="event.stopPropagation(); openEditPersonaModal(this);"
      aria-label="Edit persona"
    >
      {{ icon_edit() }}
    </button>
    {% if p.name != 'User' %}
    <button
      class="key sm danger entity-delete"
      data-persona-id="{{ p.id }}"
      data-persona-name="{{ p.name }}"
      onclick="event.stopPropagation(); promptDeletePersona(this)"
      aria-label="Delete persona"
    >
      {{ icon_trash() }}
    </button>
    {% endif %}
  </span>
</div>
