{% from "macros.html" import avatar %}
<div class="flex flex-col">
  {% if not entities %}
  <div class="empty">No matches.</div>
  {% endif %} {% for e in entities %} {% set img_path = e.image_path or e.avatar_path or None %}
  <div class="row" data-export-id="{{ e.id }}" data-export-type="{{ etype }}" onclick="BackupManager.toggleExportEntity(this)">
    {{ avatar('avatar', img_path, '', e.name[:1].upper(), img_attrs='loading="lazy"') }}
    <span class="row-title">{{ e.name }}</span>
    <span class="row-actions">
      <input type="checkbox" class="check pointer-events-none" onclick="event.stopPropagation()" />
    </span>
  </div>
  {% endfor %}
</div>
