{% from "macros.html" import icon_search, icon_help %}
{% from "modal-shell.html" import modal_shell %}
<!-- Macro Reference Modal -->
{% call modal_shell('macro-help-modal', 'Macro Reference', max_width='600px', z_index='2000') %}
<div x-data="macroHelp()" class="flex flex-col gap-2">
  <div class="relative">
    <span style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;display:flex;">{{ icon_search(14) }}</span>
    <input
      type="text"
      x-model="query"
      class="form-control"
      style="padding-left:2.25rem;"
      placeholder="Search macros and tokens…"
      autocomplete="off"
    />
  </div>
  <div class="flex flex-col max-h-[60vh] overflow-y-auto pr-2 scroll-fade">
    <template x-if="filteredMacros.length > 0">
      <div class="flex items-center justify-between mt-1 mb-1 text-xs font-bold text-muted uppercase tracking-wider">
        <span>Built-in Macros</span>
        <span class="text-[10px] font-mono" x-text="filteredMacros.length + ' / ' + macros.length"></span>
      </div>
    </template>
    <template x-for="m in filteredMacros" :key="m.syntax">
      <button
        type="button"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md transition-colors hover:bg-[var(--surface-3)] cursor-pointer"
        @click="copy(m.syntax)"
        :title="'Click to copy ' + m.syntax"
      >
        <code class="font-mono text-xs bg-(--surface-3) px-1.5 py-0.5 rounded whitespace-nowrap shrink-0" x-text="m.syntax"></code>
        <span class="text-xs text-muted flex-1 min-w-0" x-text="m.description"></span>
        <span class="text-[10px] uppercase tracking-wider text-muted border border-(--border) rounded-full px-1.5 py-0.5 shrink-0" x-text="m.badge"></span>
      </button>
    </template>
    <template x-if="filteredTokens.length > 0">
      <div class="flex items-center justify-between mt-3 mb-1 pt-2 text-xs font-bold text-muted uppercase tracking-wider" style="border-top: 1px solid var(--border)">
        <span>Special Tokens</span>
        <span class="text-[10px] font-mono" x-text="filteredTokens.length + ' / ' + tokens.length"></span>
      </div>
    </template>
    <template x-for="t in filteredTokens" :key="t.syntax">
      <button
        type="button"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded-md transition-colors hover:bg-[var(--surface-3)] cursor-pointer"
        @click="copy(t.syntax)"
        :title="'Click to copy ' + t.syntax"
      >
        <code class="font-mono text-xs bg-(--surface-3) px-1.5 py-0.5 rounded whitespace-nowrap shrink-0" x-text="t.syntax"></code>
        <span class="text-xs text-muted flex-1 min-w-0" x-text="t.description"></span>
        <span class="text-[10px] uppercase tracking-wider text-muted border border-(--border) rounded-full px-1.5 py-0.5 shrink-0" x-text="t.badge"></span>
      </button>
    </template>
    <template x-if="filteredMacros.length === 0 && filteredTokens.length === 0">
      <div class="text-center text-muted text-sm py-6">No matches for “<span x-text="query"></span>”</div>
    </template>
  </div>
</div>
{% endcall %}

<script>
  if (!window._macroReferenceScriptsLoaded) {
    window._macroReferenceScriptsLoaded = true;

    window.openMacroHelp = function () {
      openModal('macro-help-modal');
      setTimeout(function () {
        var i = document.querySelector('#macro-help-modal input');
        if (i) i.focus();
      }, 50);
    };

    window._macroHelpData = {
      macros: {{ macro_definitions | tojson }},
      tokens: {{ special_tokens | tojson }},
    };

    window._filterMacroHelp = function (items, query) {
      var q = (query || '').trim().toLowerCase();
      if (!q) return items;
      return items.filter(function (it) {
        return (
          it.syntax.toLowerCase().indexOf(q) > -1 ||
          it.description.toLowerCase().indexOf(q) > -1
        );
      });
    };

    window._copyMacroFallback = function (text, done) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        done();
      } catch (e) {
        if (window.showErrorToast) window.showErrorToast('Copy failed');
      }
      document.body.removeChild(ta);
    };

    window.macroHelp = function () {
      var data = window._macroHelpData;
      var macros = Object.keys(data.macros || {}).map(function (k) {
        var def = data.macros[k] || {};
        var source = def.source === 'character card' ? 'card' : def.source || 'macro';
        return {
          syntax: '{' + '{' + k + '}' + '}',
          description: def.description || '',
          badge: source.toUpperCase(),
        };
      });
      var tokens = (data.tokens || []).map(function (t) {
        return {
          syntax: t.syntax,
          description: t.description || '',
          badge: 'TOKEN',
        };
      });
      return {
        query: '',
        macros: macros,
        tokens: tokens,
        get filteredMacros() {
          return window._filterMacroHelp(this.macros, this.query);
        },
        get filteredTokens() {
          return window._filterMacroHelp(this.tokens, this.query);
        },
        copy: function (syntax) {
          var done = function () {
            if (window.showInfoToast) window.showInfoToast('Copied ' + syntax);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(syntax).then(done, function () {
              window._copyMacroFallback(syntax, done);
            });
          } else {
            window._copyMacroFallback(syntax, done);
          }
        },
      };
    };
  }
</script>
