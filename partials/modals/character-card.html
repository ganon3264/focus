{% from "macros.html" import icon_edit, icon_trash, icon_star, icon_star_filled, avatar %}
<div
  class="row entity-row{% if current_character_id == char.id %} active{% endif %}"
  data-ui="entity-row"
  id="char-card-{{ char.id }}"
  data-char-name="{{ char.name }}"
  data-char-created="{{ char.created_at }}"
  data-char-group="{{ char.get('group_name') or '' }}"
  data-char-favorite="{{ '1' if char.get('is_favorite') else '0' }}"
  role="button"
  tabindex="0"
  onclick="selectCharModal(this)"
  data-char-id="{{ char.id }}"
>
  {{ avatar('avatar', char.image_path, char.name ~ ' avatar', char.name[:1], img_attrs='loading="lazy"') }}
  <span class="row-title" title="{{ char.card.get('description','') }}">{{ char.name }}</span>
  <span class="row-meta">{{ char.get('group_name') or '—' }}</span>
  <span class="row-actions" onclick="event.stopPropagation()">
    <button
      class="key sm fav-star{% if char.get('is_favorite') %} favorite-active{% endif %}"
      data-ui="fav-star"
      onclick="event.stopPropagation(); toggleCharFavorite(this)"
      aria-label="Toggle favorite"
      title="Favorite"
    >
      <span class="fav-star-outline">{{ icon_star(14) }}</span>
      <span class="fav-star-filled">{{ icon_star_filled(14) }}</span>
    </button>
    <button
      class="key sm"
      data-char-id="{{ char.id }}"
      data-char-name="{{ char.name }}"
      data-char-desc="{{ char.card.get('description','') }}"
      data-char-personality="{{ char.card.get('personality','') }}"
      data-char-scenario="{{ char.card.get('scenario','') }}"
      data-char-mes-example="{{ char.card.get('mes_example','') }}"
      data-char-blocks="{{ (char.get('blocks') or []) | length }}"
      data-char-image="{{ char.image_path or '' }}"
      data-char-theme="{{ char.theme_id or '' }}"
      data-char-group="{{ char.get('group_name') or '' }}"
      data-char-media="{{ char.images | tojson | forceescape }}"
      onclick="event.stopPropagation(); openEditCharacterModal(this);"
      aria-label="Edit character"
    >
      {{ icon_edit() }}
    </button>
    <button
      class="key sm danger entity-delete"
      data-char-id="{{ char.id }}"
      data-char-name="{{ char.name }}"
      onclick="event.stopPropagation(); promptDeleteChar(this)"
      aria-label="Delete character"
    >
      {{ icon_trash() }}
    </button>
  </span>
</div>
