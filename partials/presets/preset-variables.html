<div id="preset-variables-container-{{ preset_id }}" data-preset-id="{{ preset_id }}" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
  {% if var_groups %}
    <div class="flex flex-col gap-1.5 overflow-y-auto pr-2 scroll-fade" id="preset-variables-sortable-{{ preset_id }}" style="flex: 1; min-height: 0;">
    {% for vname, vblocks in var_groups.items() %}
      {% include "presets/var-group.html" %}
    {% endfor %}
    </div>
  {% else %}
    <div class="scroll-fade" style="flex: 1; min-height: 0; overflow-y: auto; padding-right: 0.5rem;">
      <div class="text-muted text-sm">No variables configured.</div>
    </div>
  {% endif %}
  <script>
    setTimeout(() => {
      if (window.initVarSortables) window.initVarSortables('{{ preset_id }}');
    }, 50);
  </script>
</div>
