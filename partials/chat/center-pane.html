{% from "macros.html" import icon_paperclip, icon_send, icon_stop %}
<!-- Center -->
<main class="main-content">
  {% if chat_id %}
  <div class="chat-center" data-ui="chat-center">
    <div class="reasoning-sticky-host hidden" id="reasoning-sticky-host">
      <button type="button" class="chip reasoning-sticky-pill" data-ui="reasoning-sticky-pill" aria-label="Toggle reasoning">
        <span class="reasoning-chevron caret-mark" aria-hidden="true"></span>
        <span>Reasoning</span>
      </button>
    </div>
    <div class="message-list" id="message-list" data-last-role="{{ messages[-1].role if messages else '' }}">
      {% include "chat/message-list.html" %}
    </div>
  </div>
  <div class="input-bar flex-col gap-2 items-center relative">
    <div class="input-bar-content">
      <div id="staging-area" class="well staging-area flex overflow-x-auto empty:hidden pointer-events-auto"></div>
    
    <!-- Standard Input -->
    <div id="standard-input-container" class="well input-wrapper relative w-full">
      <input type="file" id="file-upload" class="hidden" multiple accept="image/*,audio/*">
       <button id="attach-btn" class="key lg raised attach-btn" data-action="actionTriggerFileUpload" data-target="file-upload" title="Attach files" aria-label="Attach files">
        {{ icon_paperclip(20) }}
      </button>
      <textarea id="chat-input" rows="1" placeholder="Type a message…"></textarea>
       <button id="send-btn" class="key lg primary send-btn" aria-label="Send message">
        {{ icon_send() }}
      </button>
       <button id="stop-btn" class="key lg primary danger stop-btn hidden" aria-label="Stop generating">
        {{ icon_stop() }}
      </button>
    </div>

    <!-- Delete Toolbar -->
      <div id="delete-toolbar" class="well danger delete-toolbar relative w-full hidden">
        <div class="row-label danger"><span id="delete-selected-count">0</span> Selected for deletion</div>
        <div class="flex gap-2">
          <button class="btn sm" onclick="exitDeleteMode()">Cancel</button>
          <button id="delete-selected-btn" class="btn sm danger" disabled data-chat-id="{{ chat_id }}" onclick="bulkDeleteSelected(this.dataset.chatId || StateManager.get('chat_id'))">Delete Selected</button>
        </div>
      </div>
    </div>
  </div>
  {% else %}
  <div id="setup-checklist" class="flex-1 flex flex-col items-center justify-center p-8 text-center" style="height: 100%;">
    {% include "chat/setup-checklist.html" %}
  </div>
  {% endif %}
</main>
{% include "chat/message-templates.html" %}
