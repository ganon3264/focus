{% from "macros.html" import icon_chevron_right, icon_plus, icon_trash %}
<!-- Right Sidebar -->
<aside class="right-sidebar" id="right-sidebar">
  <div class="sidebar-inner">
  <div class="sidebar-section flex flex-col h-full" style="border-bottom: none; padding-bottom: 0;">
    <div class="sidebar-title flex justify-between items-center">
      <button class="action-icon" onclick="toggleSidebar('right')" title="Collapse" aria-label="Toggle sidebar">{{ icon_chevron_right(14) }}</button>
      <span>Chats</span>
    </div>
    
    {% if has_characters %}
      <button class="btn btn-create btn-sm w-full" onclick="newChat()">{{ icon_plus(14) }} New Chat</button>
    {% else %}
      <button class="btn btn-primary btn-sm w-full" onclick="openModal('modal-characters')">{{ icon_plus(14) }} Add Character</button>
    {% endif %}

    <div class="sidebar-rule"></div>

    <div id="chat-list" class="sidebar-list flex-1 flex flex-col min-h-0">
      {% include "chat/chat-list.html" %}
    </div>
  </div>
  <div class="sidebar-footer">
    <div id="chat-pager">{% include "chat/chat-pager.html" %}</div>
    <button class="btn btn-secondary btn-sm" onclick="openChatTrashModal()">{{ icon_trash(14) }} Trash Bin</button>
  </div>
  </div>
</aside>

<!-- Collapsed right tab -->
 <div id="right-tab" class="right-tab hidden" onclick="toggleSidebar('right')" role="button" tabindex="0">
  <div class="sidebar-title sidebar-title-v">Chats {{ icon_chevron_right() }}</div>
</div>
