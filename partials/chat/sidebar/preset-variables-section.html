{% from "macros.html" import icon_plus %}
<div class="sidebar-section" style="flex: 1;">
  <div class="rail">
    <span>Preset Variables</span>
    {% if preset %}
    <div class="rail-actions">
      <button type="button" id="preset-add-var-btn" class="key sm create" onclick="openVarEditModal(this)" title="Add Variable" data-preset-id="{{ preset.id }}">{{ icon_plus(14) }}</button>
    </div>
    {% endif %}
  </div>
  <div id="preset-variables" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
    {% if preset %}
      {% with preset_id = preset.id, blocks = preset_blocks %}
        {% include "presets/preset-variables.html" %}
      {% endwith %}
    {% else %}
      <div class="note mt-2">Select a preset to edit variables.</div>
    {% endif %}
  </div>
</div>
